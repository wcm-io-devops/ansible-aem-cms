---
name: CI

permissions:
  contents: read

env:
  ROLE_NAME: wcm_io_devops.aem_cms

defaults:
  run:
    working-directory: 'wcm_io_devops.aem_cms'

'on':
  pull_request:
  push:
    branches:
      - master

jobs:
  lint:
    name: "Lint (${{ matrix.NAME }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - NAME: min_ansible_version
            ANSIBLE_VERSION: "==2.10.*"
            ANSIBLE_LINT_VERSION: "==5.4.*"
          - NAME: latest
            ANSIBLE_VERSION: ""
            ANSIBLE_LINT_VERSION: ""

    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4
        with:
          path: '${{ env.ROLE_NAME }}'

      - name: Cache PIP
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.ANSIBLE_VERSION }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.ANSIBLE_VERSION }}-

      - name: Create ansible.cfg
        run: "printf '[defaults]\nroles_path=../' > ansible.cfg"

      - name: Set up Python 3.
        uses: actions/setup-python@v5
        with:
          python-version: '3.9.x'

      - name: Install pip tools.
        run: |
          pip3 install wheel --upgrade

      - name: Install test dependencies.
        run: >
          pip3 install yamllint
          ansible${{ matrix.ANSIBLE_VERSION }}
          ansible-lint${{ matrix.ANSIBLE_LINT_VERSION }}
          --upgrade

      - name: Install role requirements.
        run: |
          pip3 install -r requirements.txt

      - name: Install Ansible collections.
        run: |
          for attempt in 1 2 3; do
            if ansible-galaxy collection install -r requirements.yml; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Ansible Galaxy install failed (attempt $attempt/3); retrying."
          done

      - name: Lint code.
        run: |
          yamllint .
          ansible-lint

      - name: Test syntax.
        run: |
          ansible-playbook tests/test.yml -i tests/inventory --syntax-check

  galaxy:
    name: "Ansible Galaxy import"
    needs:
      - lint
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a new import on Galaxy.
        uses: robertdebock/galaxy-action@7d89099e09f4385ec4b53eb58c0d120f1ad806dd # 1.2.1
        with:
          galaxy_api_key: ${{ secrets.GALAXY_API_KEY }}
